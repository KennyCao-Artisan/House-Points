<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>House Points Leaderboard</title>
<style>
*{
  margin:0;
  padding:0;
  box-sizing:border-box;
  font-family: Baskerville, "Times New Roman", serif;
}
body{
  background:#12141b;
  color:#eeeeee;
  min-height:100vh;
  padding:48px 24px;
}
header{
  text-align:center;
  margin-bottom:64px;
}
h1{
  font-size:56px;
  font-weight:600;
  letter-spacing:2px;
  margin-bottom:12px;
  text-align:center;
  color:#ffffff;
}
.subtitle{
  color:#9499aa;
  font-size:20px;
  text-align:center;
  font-weight:400;
}
.container{
  max-width:1400px;
  margin:0 auto;
  display:grid;
  grid-template-columns: repeat(auto-fit, minmax(280px,1fr));
  gap:32px;
}
.house-card{
  background:#1b1e29;
  border-radius:18px;
  padding:44px 28px;
  box-shadow:0 4px 18px rgba(0,0,0,0.25);
  border:2px solid #2c303f;
  transition: all 0.4s ease;
  text-align:center;
}
.house-card.first-place{
  transform: scale(1.03);
  border-color:#c5c9d8;
  box-shadow:0 8px 30px rgba(197, 201, 216, 0.12);
}
.house-green{border-left:4px solid #349e57;}
.house-blue{border-left:4px solid #2b74b8;}
.house-red{border-left:4px solid #b84444;}
.house-yellow{border-left:4px solid #c9a227;}

.house-name{
  font-size:26px;
  font-weight:500;
  margin-bottom:10px;
  color:#e8eaf2;
}
.house-green .house-name{color:#72c98c;}
.house-blue .house-name{color:#63a4e0;}
.house-red .house-name{color:#e27070;}
.house-yellow .house-name{color:#e6c260;}

.house-subtitle{
  font-size:17px;
  color:#868ca0;
  margin-bottom:30px;
  font-weight:400;
}
.points-num{
  font-size:68px;
  font-weight:700;
  color:#ffffff;
}
.error-box{
  text-align:center;
  color:#ff8888;
  font-size:20px;
  margin-top:80px;
}
.update-info{
  text-align:center;
  margin-top:60px;
  color:#6b7085;
  font-size:14px;
}
</style>
</head>
<body>
<header>
  <h1>HDKWA House Points</h1>
  <div class="subtitle">🟢Warriors! 🔵Vikings! 🟡Knights! 🔴Centurions!</div>
</header>
<div class="container" id="board"></div>
<div class="error-box" id="errorBox"></div>
<div class="update-info" id="updateInfo"></div>

<script>
const CSV_URL = "https://docs.google.com/spreadsheets/d/e/2PACX-1vRpHngV7iJeVSkYznFca5ugSnMBMn2z7l0k2RZUaYA0bBuCFs-OvFY6HeWwkmhNWS1ui-Of0ggGfHaV/pub?output=csv";

const subtitleMap = {
  "Green House": "Terracotta Warriors",
  "Blue House": "Norse Vikings",
  "Red House": "Roman Centurions",
  "Yellow House": "Medieval Knights"
};
const classMap = {
  "Green House": "house-green",
  "Blue House": "house-blue",
  "Red House": "house-red",
  "Yellow House": "house-yellow"
};

async function fetchPoints(){
  try{
    const res = await fetch(CSV_URL + "&t="+Date.now());
    if(!res.ok) throw new Error("HTTP status not ok");
    const text = await res.text();
    console.log("csv原始内容：", text);
    const lines = text.trim().split("\n");
    const houses = [];
    for(let i=1;i<lines.length;i++){
      const row = lines[i].split(",");
      const name = (row[0]||"").trim();
      const pts = parseInt((row[1]||"0").trim()) || 0;
      houses.push({name, pts});
    }
    houses.sort((a,b)=> b.pts - a.pts);
    render(houses);
    document.getElementById("errorBox").innerText = "";
    document.getElementById("updateInfo").innerText = "Last updated: " + new Date().toLocaleTimeString();
  }catch(err){
    console.error("fetch错误：",err);
    document.getElementById("errorBox").innerText = "⚠️ Could not load scores. Check Google Sheet sharing settings / network.";
  }
}

function render(list){
  const container = document.getElementById("board");
  container.innerHTML = "";
  list.forEach((h, index)=>{
    const card = document.createElement("div");
    let cssClass = `house-card ${classMap[h.name]}`;
    if(index === 0) cssClass += " first-place";
    card.className = cssClass;
    card.innerHTML = `
      <div class="house-name">${h.name}</div>
      <div class="house-subtitle">${subtitleMap[h.name]}</div>
      <div class="points-num">${h.pts}</div>
    `;
    container.appendChild(card);
  })
}

fetchPoints();
setInterval(fetchPoints,15000);
</script>
</body>
</html>
